[project]
name = "coursework-3"
version = "0.1.0"
description = ""
authors = [
    {name = "alexcherch",email = "alexcherch0@gmail.com"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
]
package-mode = false


[build-system]
requires = ["poetry-core (>=2.0.0,<3.0.0)"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
    | migrations
  )/
  | manage\.py
  | config/(asgi|wsgi)\.py
)
'''

[tool.isort]
profile = "black"
line_length = 119
