{% extends 'mailing/base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5 text-center" style="max-width: 600px;">
    <div class="card-body p-5">
        <div class="display-1 text-success mb-3">✅</div>
        <h3 class="fw-bold text-dark mb-3">Пароль изменён</h3>
        <p class="text-muted mb-4">
            Ваш пароль успешно обновлён. Теперь вы можете войти с новым паролем.
        </p>
        <a href="{% url 'users:login' %}" class="btn btn-primary">Войти</a>
    </div>
</div>
{% endblock %}
