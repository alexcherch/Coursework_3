{% extends 'mailing/base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5" style="max-width: 500px;">
    <div class="card-body p-4">
        <h3 class="fw-bold text-dark mb-3 text-center">Восстановление пароля</h3>
        <p class="text-muted text-center mb-4">
            Введите email, указанный при регистрации, — мы отправим ссылку для сброса пароля.
        </p>

        <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label fw-semibold text-secondary">
                        {{ field.label }}
                    </label>
                    <input type="email"
                           name="{{ field.name }}"
                           id="{{ field.id_for_label }}"
                           class="form-control"
                           value="{{ field.value|default:'' }}"
                           required>
                    {% if field.errors %}
                        <div class="text-danger small mt-1">
                            {{ field.errors|join:", " }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <div class="d-flex justify-content-end mt-4">
                <a href="{% url 'users:login' %}" class="btn btn-outline-secondary me-2">Назад</a>
                <button type="submit" class="btn btn-primary">Отправить</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
