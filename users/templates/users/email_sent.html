{% extends 'mailing/base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5 text-center" style="max-width: 600px;">
    <div class="card-body p-5">
        <div class="display-1 text-success mb-3">📧</div>
        <h3 class="fw-bold text-dark mb-3">Проверьте почту</h3>
        <p class="text-muted mb-4">
            Мы отправили вам письмо со ссылкой для подтверждения email.
            Перейдите по ней, чтобы завершить регистрацию.
        </p>
        <p class="small text-muted mb-4">
            Если письмо не пришло — проверьте папку «Спам» или напишите в поддержку.
        </p>
        <a href="{% url 'mailing:index' %}" class="btn btn-outline-secondary">На главную</a>
    </div>
</div>
{% endblock %}
