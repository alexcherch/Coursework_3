{% extends 'mailing/base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5 text-center" style="max-width: 600px;">
    <div class="card-body p-5">
        <div class="display-1 text-danger mb-3">❌</div>
        <h3 class="fw-bold text-dark mb-3">Ссылка недействительна</h3>
        <p class="text-muted mb-4">
            Возможно, ссылка уже использована или срок её действия истёк (24 часа).
            Зарегистрируйтесь заново или запросите новое письмо.
        </p>
        <a href="{% url 'users:register' %}" class="btn btn-primary me-2">Зарегистрироваться заново</a>
        <a href="{% url 'mailing:index' %}" class="btn btn-outline-secondary">На главную</a>
    </div>
</div>
{% endblock %}
