{% extends 'mailing/base.html' %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'mailing:message_list' %}" class="text-decoration-none text-muted">← Назад к списку</a>
</div>

<div class="card border-0 shadow-sm max-width-md mx-auto" style="max-width: 750px;">
    <div class="card-header bg-white border-0 pt-4 ps-4">
        <span class="badge bg-secondary mb-2">Сообщение #{{ object.id }}</span>
        <h3 class="card-title fw-bold text-dark mb-0">{{ object.title }}</h3>
    </div>
    <div class="card-body ps-4 pe-4">
        <hr class="text-muted my-3">

        <div class="mb-2">
            <label class="form-label text-muted small text-uppercase fw-bold mb-2">Текст письма (Тело сообщения)</label>
            <!-- Фильтр linebreaksbr сохраняет переносы строк, как их ввели в форме -->
            <div class="bg-light p-4 rounded text-dark font-monospace" style="white-space: pre-line;">{{ object.body }}</div>
        </div>
    </div>
    <div class="card-footer bg-white border-0 pb-4 ps-4 pe-4 d-flex justify-content-end">
        <a href="{% url 'mailing:message_update' object.id %}" class="btn btn-outline-secondary me-2">Редактировать</a>
        <a href="{% url 'mailing:message_delete' object.id %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% endblock %}
