{% extends 'mailing/base.html' %}

{% block content %}
<div class="mb-4">
    <a href="{% url 'mailing:client_list' %}" class="text-decoration-none text-muted">← Назад к списку</a>
</div>

<div class="card border-0 shadow-sm max-width-md mx-auto" style="max-width: 600px;">
    <div class="card-header bg-white border-0 pt-4 ps-4">
        <span class="badge bg-secondary mb-2">ID клиента: #{{ object.id }}</span>
        <h3 class="card-title fw-bold text-dark mb-0">{{ object.full_name }}</h3>
    </div>
    <div class="card-body ps-4 pe-4">
        <hr class="text-muted my-3">

        <div class="mb-3">
            <label class="form-label text-muted small text-uppercase fw-bold mb-1">Email адрес</label>
            <p class="fs-5 mb-0"><a href="mailto:{{ object.email }}" class="text-decoration-none">{{ object.email }}</a></p>
        </div>

        <div class="mb-3">
            <label class="form-label text-muted small text-uppercase fw-bold mb-1">Комментарий / Заметка</label>
            <p class="bg-light p-3 rounded text-secondary mb-0">
                {{ object.comment|default:"Комментарий отсутствует."|linebreaksbr }}
            </p>
        </div>
    </div>
    <div class="card-footer bg-white border-0 pb-4 ps-4 pe-4 d-flex justify-content-end">
        <a href="{% url 'mailing:client_update' object.id %}" class="btn btn-outline-secondary me-2">Редактировать</a>
        <a href="{% url 'mailing:client_delete' object.id %}" class="btn btn-danger">Удалить</a>
    </div>
</div>
{% endblock %}
