{% extends 'mailing/base.html' %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5" style="max-width: 500px;">
    <div class="card-body p-4 text-center">
        <div class="text-danger mb-3">
            <!-- Простая иконка предупреждения -->
            <svg xmlns="http://w3.org" width="48" height="48" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
                <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06c-.01.006-.017.01-.022.011H1.146a.1.1 0 0 1-.054-.012.2.2 0 0 1-.054-.06.17.17 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
                <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
            </svg>
        </div>
        <h4 class="fw-bold mb-3">Удаление получателя</h4>
        <p class="text-muted mb-4">Вы уверены, что хотите удалить клиента <strong>"{{ object.full_name }}"</strong>? Это действие нельзя будет отменить.</p>

        <form method="post">
            {% csrf_token %}
            <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-secondary me-2">Отмена</a>
            <button type="submit" class="btn btn-danger">Да, удалить</button>
        </form>
    </div>
</div>
{% endblock %}
